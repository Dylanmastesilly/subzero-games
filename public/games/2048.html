<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>2048</title>
    <style>
      :root {
        --bg: #040a13;
        --panel: #0b1829;
        --panel-border: #1a3352;
        --board: #081220;
        --cell: #102238;
        --text: #eef6ff;
        --muted: #86a7c8;
        --accent: #38bdf8;
        --accent-ink: #041322;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: radial-gradient(ellipse 80% 55% at 50% 0%, rgba(56, 189, 248, 0.14) 0%, #040a13 70%);
        color: var(--text);
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .app {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .title-wrap {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #f4f9ff;
        font-variant-numeric: tabular-nums;
      }

      .subtitle {
        font-size: 12px;
        color: var(--muted);
      }

      .scores {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .score-box {
        min-width: 78px;
        padding: 6px 12px;
        border-radius: 8px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        text-align: center;
      }

      .score-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .score-val {
        font-size: 18px;
        font-weight: 700;
        color: #f4f9ff;
        font-variant-numeric: tabular-nums;
      }

      .controls-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .hint {
        font-size: 12px;
        color: var(--muted);
      }

      .btn-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button {
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--panel-border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
        transition: background-color 140ms ease, border-color 140ms ease;
      }

      button:hover:not(:disabled) {
        background: #132844;
        border-color: #2e5888;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      button.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: transparent;
        font-weight: 700;
      }

      button.primary:hover:not(:disabled) {
        background: #7dd3fc;
      }

      .board-wrap {
        position: relative;
        width: min(100%, calc(100vh - 132px));
        margin: 0 auto;
        aspect-ratio: 1 / 1;
        padding: 12px;
        background: var(--board);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        box-shadow: inset 0 1px 0 rgba(186, 230, 253, 0.08);
        touch-action: none;
      }

      .grid-bg {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 10px;
        width: 100%;
        height: 100%;
      }

      .grid-cell {
        background: var(--cell);
        border-radius: 8px;
      }

      .tile-layer {
        position: absolute;
        inset: 12px;
        pointer-events: none;
      }

      .tile {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
        transition: transform 115ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform;
      }

      .tile-inner {
        width: 100%;
        height: 100%;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
      }

      .tile-new .tile-inner {
        animation: pop-in 150ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .tile-merged .tile-inner {
        animation: merge-pop 170ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes pop-in {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes merge-pop {
        0% { transform: scale(0.9); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }

      /* Glacial tile palette */
      .v2 .tile-inner { background: #dbeafe; color: #0b1e33; }
      .v4 .tile-inner { background: #bae6fd; color: #082038; }
      .v8 .tile-inner { background: #7dd3fc; color: #051629; }
      .v16 .tile-inner { background: #38bdf8; color: #041322; }
      .v32 .tile-inner { background: #0ea5e9; color: #ffffff; }
      .v64 .tile-inner { background: #0284c7; color: #ffffff; }
      .v128 .tile-inner { background: #0369a1; color: #ffffff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 0 14px rgba(56, 189, 248, 0.25); }
      .v256 .tile-inner { background: #2563eb; color: #ffffff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 0 16px rgba(37, 99, 235, 0.35); }
      .v512 .tile-inner { background: #4f46e5; color: #ffffff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 0 18px rgba(79, 70, 229, 0.38); }
      .v1024 .tile-inner { background: #7c3aed; color: #ffffff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 0 20px rgba(124, 58, 237, 0.42); }
      .v2048 .tile-inner { background: #f59e0b; color: #09131f; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 0 24px rgba(245, 158, 11, 0.45); }
      .vsuper .tile-inner { background: #10b981; color: #041c14; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 0 24px rgba(16, 185, 129, 0.45); }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: rgba(4, 10, 19, 0.84);
        backdrop-filter: blur(4px);
        border-radius: 12px;
      }

      .overlay.hidden {
        display: none;
      }

      .overlay h2 {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        color: #f4f9ff;
      }

      .overlay p {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }

      .overlay-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        .tile { transition: none; }
        .tile-new .tile-inner, .tile-merged .tile-inner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="hud">
        <div class="title-wrap">
          <h1>2048</h1>
          <span class="subtitle">Combine tiles to reach 2048</span>
        </div>

        <div class="scores">
          <div class="score-box">
            <div class="score-label">Score</div>
            <div id="scoreVal" class="score-val">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">Best</div>
            <div id="bestVal" class="score-val">0</div>
          </div>
        </div>
      </div>

      <div class="controls-bar">
        <span class="hint">Arrow keys, WASD, or swipe</span>
        <div class="btn-group">
          <button type="button" id="soundBtn">Sound On</button>
          <button type="button" id="undoBtn" disabled>Undo</button>
          <button type="button" id="newGameBtn" class="primary">New Game</button>
        </div>
      </div>

      <div id="boardWrap" class="board-wrap" tabindex="0" aria-label="2048 Game Board">
        <div class="grid-bg">
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
        <div id="tileLayer" class="tile-layer"></div>

        <div id="overlay" class="overlay hidden">
          <h2 id="overlayTitle">Game Over</h2>
          <p id="overlayDesc">Final Score: 0</p>
          <div class="overlay-actions">
            <button type="button" id="continueBtn" class="hidden">Keep Playing</button>
            <button type="button" id="playAgainBtn" class="primary">Play Again</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const BEST_KEY = 'subzero_2048_best_v1';
      const SIZE = 4;
      const GAP = 10;

      let grid = [];
      let score = 0;
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      let prevState = null;
      let wonAcknowledged = false;
      let nextTileId = 1;
      let soundEnabled = true;
      let audioCtx = null;

      const scoreEl = document.getElementById('scoreVal');
      const bestEl = document.getElementById('bestVal');
      const undoBtn = document.getElementById('undoBtn');
      const soundBtn = document.getElementById('soundBtn');
      const newGameBtn = document.getElementById('newGameBtn');
      const boardWrap = document.getElementById('boardWrap');
      const tileLayer = document.getElementById('tileLayer');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayDesc = document.getElementById('overlayDesc');
      const continueBtn = document.getElementById('continueBtn');
      const playAgainBtn = document.getElementById('playAgainBtn');

      function playTone(freq, dur) {
        if (!soundEnabled) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          if (!audioCtx) audioCtx = new Ctx();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch {
          // Ignore audio errors
        }
      }

      function cloneGrid(src) {
        return src.map((row) => row.map((cell) => (cell ? { ...cell, isNew: false, merged: false } : null)));
      }

      function initGame() {
        grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
        score = 0;
        prevState = null;
        wonAcknowledged = false;
        overlay.classList.add('hidden');
        spawnRandomTile();
        spawnRandomTile();
        render();
      }

      function spawnRandomTile() {
        const empty = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (!grid[r][c]) empty.push([r, c]);
          }
        }
        if (empty.length === 0) return false;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = {
          id: nextTileId++,
          val: Math.random() < 0.9 ? 2 : 4,
          isNew: true,
          merged: false
        };
        return true;
      }

      function slideLine(line) {
        const nonEmpty = line.filter(Boolean).map((t) => ({ ...t, isNew: false, merged: false }));
        const out = [];
        let moved = false;
        let gained = 0;
        let mergedAny = false;

        for (let i = 0; i < nonEmpty.length; i++) {
          if (i + 1 < nonEmpty.length && nonEmpty[i].val === nonEmpty[i + 1].val) {
            const newVal = nonEmpty[i].val * 2;
            out.push({
              id: nextTileId++,
              val: newVal,
              isNew: false,
              merged: true
            });
            gained += newVal;
            mergedAny = true;
            i++;
          } else {
            out.push(nonEmpty[i]);
          }
        }

        while (out.length < SIZE) out.push(null);

        for (let i = 0; i < SIZE; i++) {
          const a = line[i];
          const b = out[i];
          if ((a === null) !== (b === null) || (a && b && (a.val !== b.val || a.id !== b.id))) {
            moved = true;
            break;
          }
        }

        return { out, moved, gained, mergedAny };
      }

      function move(dir) {
        if (!overlay.classList.contains('hidden')) return;

        const snapshot = { grid: cloneGrid(grid), score };
        let moved = false;
        let gainedTotal = 0;
        let mergedAny = false;

        const next = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));

        for (let i = 0; i < SIZE; i++) {
          const line = [];
          for (let j = 0; j < SIZE; j++) {
            if (dir === 'left') line.push(grid[i][j]);
            else if (dir === 'right') line.push(grid[i][SIZE - 1 - j]);
            else if (dir === 'up') line.push(grid[j][i]);
            else if (dir === 'down') line.push(grid[SIZE - 1 - j][i]);
          }

          const res = slideLine(line);
          if (res.moved) moved = true;
          if (res.mergedAny) mergedAny = true;
          gainedTotal += res.gained;

          for (let j = 0; j < SIZE; j++) {
            if (dir === 'left') next[i][j] = res.out[j];
            else if (dir === 'right') next[i][SIZE - 1 - j] = res.out[j];
            else if (dir === 'up') next[j][i] = res.out[j];
            else if (dir === 'down') next[SIZE - 1 - j][i] = res.out[j];
          }
        }

        if (!moved) return;

        prevState = snapshot;
        grid = next;
        score += gainedTotal;
        if (score > best) {
          best = score;
          localStorage.setItem(BEST_KEY, String(best));
        }

        spawnRandomTile();
        playTone(mergedAny ? 520 : 280, mergedAny ? 0.08 : 0.045);
        render();
        checkEndStates();
      }

      function canMove() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const cell = grid[r][c];
            if (!cell) return true;
            if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].val === cell.val) return true;
            if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].val === cell.val) return true;
          }
        }
        return false;
      }

      function has2048() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (grid[r][c] && grid[r][c].val >= 2048) return true;
          }
        }
        return false;
      }

      function checkEndStates() {
        if (!wonAcknowledged && has2048()) {
          wonAcknowledged = true;
          overlayTitle.textContent = '2048 Reached';
          overlayDesc.textContent = `Score: ${score.toLocaleString()}`;
          continueBtn.classList.remove('hidden');
          overlay.classList.remove('hidden');
          playTone(660, 0.16);
          return;
        }
        if (!canMove()) {
          overlayTitle.textContent = 'Game Over';
          overlayDesc.textContent = `Final Score: ${score.toLocaleString()}`;
          continueBtn.classList.add('hidden');
          overlay.classList.remove('hidden');
          playTone(180, 0.18);
        }
      }

      function tileClass(val) {
        return val <= 2048 ? `v${val}` : 'vsuper';
      }

      function tileFontSize(val, cellSize) {
        const digits = String(val).length;
        if (digits <= 2) return Math.round(cellSize * 0.44);
        if (digits === 3) return Math.round(cellSize * 0.36);
        if (digits === 4) return Math.round(cellSize * 0.29);
        return Math.round(cellSize * 0.24);
      }

      function render() {
        scoreEl.textContent = score.toLocaleString();
        bestEl.textContent = best.toLocaleString();
        undoBtn.disabled = !prevState;

        const layerWidth = tileLayer.clientWidth;
        const cellSize = (layerWidth - GAP * (SIZE - 1)) / SIZE;

        tileLayer.innerHTML = '';
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const cell = grid[r][c];
            if (!cell) continue;
            const tile = document.createElement('div');
            tile.className = `tile ${tileClass(cell.val)}${cell.isNew ? ' tile-new' : ''}${cell.merged ? ' tile-merged' : ''}`;
            tile.style.width = `${cellSize}px`;
            tile.style.height = `${cellSize}px`;
            tile.style.fontSize = `${tileFontSize(cell.val, cellSize)}px`;
            tile.style.transform = `translate(${c * (cellSize + GAP)}px, ${r * (cellSize + GAP)}px)`;

            const inner = document.createElement('div');
            inner.className = 'tile-inner';
            inner.textContent = String(cell.val);
            tile.appendChild(inner);
            tileLayer.appendChild(tile);
          }
        }
      }

      document.addEventListener('keydown', (e) => {
        const keyMap = {
          ArrowLeft: 'left',
          a: 'left',
          A: 'left',
          ArrowRight: 'right',
          d: 'right',
          D: 'right',
          ArrowUp: 'up',
          w: 'up',
          W: 'up',
          ArrowDown: 'down',
          s: 'down',
          S: 'down'
        };
        const dir = keyMap[e.key];
        if (dir) {
          e.preventDefault();
          move(dir);
        } else if (e.key === 'z' || e.key === 'Z') {
          undo();
        } else if (e.key === 'r' || e.key === 'R') {
          initGame();
        }
      });

      let startX = 0;
      let startY = 0;
      let pointerDown = false;

      boardWrap.addEventListener('pointerdown', (e) => {
        pointerDown = true;
        startX = e.clientX;
        startY = e.clientY;
        boardWrap.focus();
      });

      window.addEventListener('pointerup', (e) => {
        if (!pointerDown) return;
        pointerDown = false;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      });

      function undo() {
        if (!prevState) return;
        grid = prevState.grid;
        score = prevState.score;
        prevState = null;
        overlay.classList.add('hidden');
        render();
      }

      undoBtn.addEventListener('click', undo);
      newGameBtn.addEventListener('click', initGame);
      playAgainBtn.addEventListener('click', initGame);
      continueBtn.addEventListener('click', () => overlay.classList.add('hidden'));
      soundBtn.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        soundBtn.textContent = soundEnabled ? 'Sound On' : 'Sound Off';
      });

      window.addEventListener('resize', render);
      initGame();
    </script>
  </body>
</html>
