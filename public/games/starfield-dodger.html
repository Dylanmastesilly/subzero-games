<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starfield Dodger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #070b18;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .shell { display: flex; flex-direction: column; width: 100%; height: 100%; }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: #0d152a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .hud-group { display: flex; align-items: center; gap: 18px; }
    .hud-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 6px; }
    .hud-value { font-weight: 700; }
    .btn-sm {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      min-height: 0;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 800 / 520;
      background: #090f22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 11, 24, 0.84);
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .card {
      max-width: 400px;
      width: 100%;
      background: #121c38;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
    }
    .card h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .card p { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 18px; }
    .controls-note {
      background: #090f22;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .btn-primary {
      background: #e11d48;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 11px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { background: #be123c; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hud">
      <div class="hud-group">
        <div><span class="hud-label">Score</span><span class="hud-value" id="scoreEl">0</span></div>
        <div><span class="hud-label">Best</span><span class="hud-value" id="bestEl">0</span></div>
        <div><span class="hud-label">Wave</span><span class="hud-value" id="waveEl">1</span></div>
        <div><span class="hud-label">Shield</span><span class="hud-value" id="shieldEl">Ready</span></div>
      </div>
      <div class="hud-group">
        <button class="btn-sm" id="soundBtn" type="button">Sound: On</button>
      </div>
    </div>
    <div class="stage">
      <canvas id="canvas" width="800" height="520"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <h1 id="overlayTitle">Starfield Dodger</h1>
          <p id="overlayDesc">Weave past drifting asteroid shards and harvest golden energy crystals. Blue orbs restore your ship shield.</p>
          <div class="controls-note">Steer with Arrow Keys, WASD, Mouse, or Touch drag.</div>
          <button class="btn-primary" id="startBtn" type="button">Start Flight</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const scoreEl = document.getElementById('scoreEl');
      const bestEl = document.getElementById('bestEl');
      const waveEl = document.getElementById('waveEl');
      const shieldEl = document.getElementById('shieldEl');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayDesc = document.getElementById('overlayDesc');
      const startBtn = document.getElementById('startBtn');
      const soundBtn = document.getElementById('soundBtn');

      const BEST_KEY = 'recess_starfield_best';
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = best;

      let soundOn = true;
      let audioCtx = null;
      function beep(freq, dur, type) {
        if (!soundOn) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = type || 'sine';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.07, audioCtx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          o.connect(g); g.connect(audioCtx.destination);
          o.start(); o.stop(audioCtx.currentTime + dur);
        } catch (_) {}
      }

      const stars = Array.from({ length: 70 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        s: 0.7 + Math.random() * 1.8,
        v: 0.6 + Math.random() * 2.2
      }));

      let state = 'MENU';
      let player = { x: W / 2, y: H - 80, r: 14, shield: true, invuln: 0 };
      let target = null;
      let keys = {};
      let rocks = [];
      let crystals = [];
      let shields = [];
      let sparks = [];
      let score = 0;
      let frame = 0;

      function syncHud() {
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem(BEST_KEY, String(best));
          bestEl.textContent = best;
        }
        const wave = 1 + Math.floor(frame / 480);
        waveEl.textContent = wave;
        shieldEl.textContent = player.shield ? 'Active' : 'Down';
      }

      function startGame() {
        player = { x: W / 2, y: H - 80, r: 14, shield: true, invuln: 0 };
        target = null;
        rocks = [];
        crystals = [];
        shields = [];
        sparks = [];
        score = 0;
        frame = 0;
        state = 'PLAYING';
        overlay.classList.add('hidden');
        syncHud();
      }

      function burst(x, y, color) {
        for (let i = 0; i < 12; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 1 + Math.random() * 3.5;
          sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color });
        }
      }

      function update() {
        for (const st of stars) {
          st.y += st.v;
          if (st.y > H) { st.y = 0; st.x = Math.random() * W; }
        }
        if (state !== 'PLAYING') return;

        frame++;
        if (frame % 12 === 0) { score += 1; syncHud(); }
        if (player.invuln > 0) player.invuln--;

        const speed = 6.2;
        if (keys.ArrowLeft || keys.a || keys.A) { player.x -= speed; target = null; }
        if (keys.ArrowRight || keys.d || keys.D) { player.x += speed; target = null; }
        if (keys.ArrowUp || keys.w || keys.W) { player.y -= speed; target = null; }
        if (keys.ArrowDown || keys.s || keys.S) { player.y += speed; target = null; }

        if (target) {
          player.x += (target.x - player.x) * 0.22;
          player.y += (target.y - player.y) * 0.22;
        }

        player.x = Math.max(20, Math.min(W - 20, player.x));
        player.y = Math.max(20, Math.min(H - 20, player.y));

        const wave = 1 + Math.floor(frame / 480);
        const spawnInterval = Math.max(11, 28 - wave * 2);
        if (frame % spawnInterval === 0) {
          const r = 14 + Math.random() * 20;
          rocks.push({
            x: r + Math.random() * (W - r * 2),
            y: -r,
            r,
            vx: (Math.random() - 0.5) * 1.4,
            vy: 2.8 + Math.random() * 2.2 + wave * 0.35,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.06
          });
        }

        if (frame % 70 === 0) {
          crystals.push({ x: 30 + Math.random() * (W - 60), y: -14, r: 10, vy: 2.6 });
        }
        if (frame % 420 === 0 && !player.shield) {
          shields.push({ x: 30 + Math.random() * (W - 60), y: -14, r: 11, vy: 2.3 });
        }

        for (let i = crystals.length - 1; i >= 0; i--) {
          const c = crystals[i];
          c.y += c.vy;
          if (Math.hypot(c.x - player.x, c.y - player.y) < c.r + player.r) {
            score += 35;
            burst(c.x, c.y, '#f59e0b');
            beep(720, 0.09, 'triangle');
            syncHud();
            crystals.splice(i, 1);
            continue;
          }
          if (c.y > H + 20) crystals.splice(i, 1);
        }

        for (let i = shields.length - 1; i >= 0; i--) {
          const s = shields[i];
          s.y += s.vy;
          if (Math.hypot(s.x - player.x, s.y - player.y) < s.r + player.r) {
            player.shield = true;
            burst(s.x, s.y, '#38bdf8');
            beep(560, 0.14, 'sine');
            syncHud();
            shields.splice(i, 1);
            continue;
          }
          if (s.y > H + 20) shields.splice(i, 1);
        }

        for (let i = rocks.length - 1; i >= 0; i--) {
          const rk = rocks[i];
          rk.x += rk.vx;
          rk.y += rk.vy;
          rk.rot += rk.vrot;
          if (player.invuln === 0 && Math.hypot(rk.x - player.x, rk.y - player.y) < rk.r * 0.85 + player.r * 0.8) {
            if (player.shield) {
              player.shield = false;
              player.invuln = 65;
              burst(player.x, player.y, '#38bdf8');
              beep(260, 0.18, 'sawtooth');
              rocks.splice(i, 1);
              syncHud();
              continue;
            } else {
              burst(player.x, player.y, '#e11d48');
              beep(140, 0.3, 'sawtooth');
              state = 'GAMEOVER';
              overlayTitle.textContent = 'Hull Breached';
              overlayDesc.textContent = 'Score: ' + score + ' · Best: ' + best;
              startBtn.textContent = 'Fly Again';
              overlay.classList.remove('hidden');
              break;
            }
          }
          if (rk.y > H + rk.r + 10) rocks.splice(i, 1);
        }

        for (let i = sparks.length - 1; i >= 0; i--) {
          const sp = sparks[i];
          sp.x += sp.vx;
          sp.y += sp.vy;
          sp.life -= 0.03;
          if (sp.life <= 0) sparks.splice(i, 1);
        }
      }

      function draw() {
        ctx.fillStyle = '#090f22';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(226, 232, 240, 0.65)';
        for (const st of stars) {
          ctx.fillRect(st.x, st.y, st.s, st.s);
        }

        for (const c of crystals) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.moveTo(0, -11); ctx.lineTo(9, 0); ctx.lineTo(0, 11); ctx.lineTo(-9, 0); ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        for (const s of shields) {
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.stroke();
        }

        for (const rk of rocks) {
          ctx.save();
          ctx.translate(rk.x, rk.y);
          ctx.rotate(rk.rot);
          ctx.fillStyle = '#927b53';
          ctx.strokeStyle = '#d4b483';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (let k = 0; k < 7; k++) {
            const a = (k / 7) * Math.PI * 2;
            const rad = rk.r * (k % 2 === 0 ? 1 : 0.78);
            if (k === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
            else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }

        if (state !== 'GAMEOVER') {
          if (player.invuln === 0 || Math.floor(player.invuln / 5) % 2 === 0) {
            ctx.save();
            ctx.translate(player.x, player.y);
            if (player.shield) {
              ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(0, 0, 22, 0, Math.PI * 2);
              ctx.stroke();
            }
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            ctx.moveTo(0, -17); ctx.lineTo(13, 13); ctx.lineTo(0, 7); ctx.lineTo(-13, 13); ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#e11d48';
            ctx.beginPath();
            ctx.moveTo(0, -17); ctx.lineTo(5, 4); ctx.lineTo(-5, 4); ctx.closePath();
            ctx.fill();
            ctx.restore();
          }
        }

        for (const sp of sparks) {
          ctx.globalAlpha = sp.life;
          ctx.fillStyle = sp.color;
          ctx.fillRect(sp.x - 2, sp.y - 2, 4, 4);
        }
        ctx.globalAlpha = 1;
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      function setPointer(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        target = {
          x: (clientX - rect.left) * (W / rect.width),
          y: (clientY - rect.top) * (H / rect.height)
        };
      }

      canvas.addEventListener('mousemove', (e) => { if (state === 'PLAYING') setPointer(e.clientX, e.clientY); });
      canvas.addEventListener('touchmove', (e) => {
        if (state === 'PLAYING' && e.touches[0]) { e.preventDefault(); setPointer(e.touches[0].clientX, e.touches[0].clientY); }
      }, { passive: false });

      window.addEventListener('keydown', (e) => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
        keys[e.key] = true;
      });
      window.addEventListener('keyup', (e) => { keys[e.key] = false; });

      startBtn.addEventListener('click', startGame);
      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        soundBtn.textContent = soundOn ? 'Sound: On' : 'Sound: Off';
      });

      loop();
    })();
  </script>
</body>
</html>
