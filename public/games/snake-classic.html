<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0d1614;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .shell { display: flex; flex-direction: column; width: 100%; height: 100%; }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: #13201c;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .hud-group { display: flex; align-items: center; gap: 18px; }
    .hud-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 6px; }
    .hud-value { font-weight: 700; }
    .btn-sm {
      background: #1e2e29;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      min-height: 0;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1;
      background: #111c19;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 22, 20, 0.85);
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .card {
      max-width: 380px;
      width: 100%;
      background: #182924;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 26px;
      text-align: center;
    }
    .card h1 { font-size: 25px; font-weight: 700; margin-bottom: 8px; }
    .card p { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 16px; }
    .opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .seg { display: flex; gap: 6px; justify-content: center; }
    .seg button {
      background: #111c19;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .seg button.active { background: #10b981; color: #052e16; border-color: #10b981; }
    .btn-primary {
      background: #10b981;
      color: #052e16;
      border: none;
      border-radius: 8px;
      padding: 11px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary:hover { background: #34d399; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hud">
      <div class="hud-group">
        <div><span class="hud-label">Score</span><span class="hud-value" id="scoreEl">0</span></div>
        <div><span class="hud-label">Best</span><span class="hud-value" id="bestEl">0</span></div>
        <div><span class="hud-label">Length</span><span class="hud-value" id="lenEl">3</span></div>
      </div>
      <div class="hud-group">
        <button class="btn-sm" id="pauseBtn" type="button">Pause</button>
      </div>
    </div>
    <div class="stage">
      <canvas id="canvas" width="520" height="520"></canvas>
      <div class="overlay" id="overlay">
        <div class="card">
          <h1 id="overlayTitle">Snake Classic</h1>
          <p id="overlayDesc">Collect ruby apples to grow longer. Golden apples grant triple bonus points before they vanish.</p>
          <div class="opts">
            <div class="seg" id="speedGroup">
              <button type="button" data-speed="130">Chill</button>
              <button type="button" data-speed="95" class="active">Standard</button>
              <button type="button" data-speed="65">Turbo</button>
            </div>
            <div class="seg" id="wallGroup">
              <button type="button" data-wall="solid" class="active">Solid Walls</button>
              <button type="button" data-wall="wrap">Wrap Edges</button>
            </div>
          </div>
          <button class="btn-primary" id="startBtn" type="button">Start Game</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const COLS = 20;
      const CELL = canvas.width / COLS;

      const scoreEl = document.getElementById('scoreEl');
      const bestEl = document.getElementById('bestEl');
      const lenEl = document.getElementById('lenEl');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayDesc = document.getElementById('overlayDesc');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');

      const BEST_KEY = 'recess_snake_best';
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = best;

      let speedMs = 95;
      let wallMode = 'solid';
      let state = 'MENU';
      let snake = [];
      let dir = { x: 1, y: 0 };
      let queue = [];
      let food = { x: 14, y: 10 };
      let bonus = null;
      let score = 0;
      let timer = null;

      document.querySelectorAll('#speedGroup button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#speedGroup button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          speedMs = Number(btn.dataset.speed);
        });
      });

      document.querySelectorAll('#wallGroup button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#wallGroup button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          wallMode = btn.dataset.wall;
        });
      });

      function randomCell() {
        let pt;
        do {
          pt = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * COLS) };
        } while (snake.some(s => s.x === pt.x && s.y === pt.y));
        return pt;
      }

      function syncHud() {
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem(BEST_KEY, String(best));
          bestEl.textContent = best;
        }
        lenEl.textContent = snake.length;
      }

      function startGame() {
        clearInterval(timer);
        snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
        dir = { x: 1, y: 0 };
        queue = [];
        score = 0;
        bonus = null;
        food = randomCell();
        state = 'PLAYING';
        pauseBtn.textContent = 'Pause';
        overlay.classList.add('hidden');
        syncHud();
        draw();
        timer = setInterval(tick, speedMs);
      }

      function endGame() {
        clearInterval(timer);
        state = 'GAMEOVER';
        overlayTitle.textContent = 'Game Over';
        overlayDesc.textContent = 'Score: ' + score + ' · Length: ' + snake.length;
        startBtn.textContent = 'Play Again';
        overlay.classList.remove('hidden');
      }

      function tick() {
        if (state !== 'PLAYING') return;
        if (queue.length > 0) dir = queue.shift();

        let nx = snake[0].x + dir.x;
        let ny = snake[0].y + dir.y;

        if (wallMode === 'wrap') {
          nx = (nx + COLS) % COLS;
          ny = (ny + COLS) % COLS;
        } else if (nx < 0 || nx >= COLS || ny < 0 || ny >= COLS) {
          endGame();
          return;
        }

        const ateFood = nx === food.x && ny === food.y;
        const bodyToCheck = ateFood ? snake : snake.slice(0, -1);
        if (bodyToCheck.some(s => s.x === nx && s.y === ny)) {
          endGame();
          return;
        }

        snake.unshift({ x: nx, y: ny });

        if (ateFood) {
          score += 10;
          food = randomCell();
          if (!bonus && Math.random() < 0.25) {
            const pos = randomCell();
            bonus = { x: pos.x, y: pos.y, ttl: 45 };
          }
        } else {
          snake.pop();
        }

        if (bonus) {
          if (nx === bonus.x && ny === bonus.y) {
            score += 30;
            bonus = null;
          } else {
            bonus.ttl--;
            if (bonus.ttl <= 0) bonus = null;
          }
        }

        syncHud();
        draw();
      }

      function draw() {
        ctx.fillStyle = '#111c19';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        for (let i = 1; i < COLS; i++) {
          ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
        }

        ctx.fillStyle = '#e11d48';
        ctx.beginPath();
        ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.36, 0, Math.PI * 2);
        ctx.fill();

        if (bonus) {
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(bonus.x * CELL + CELL / 2, bonus.y * CELL + CELL / 2, CELL * 0.38, 0, Math.PI * 2);
          ctx.fill();
        }

        snake.forEach((seg, idx) => {
          ctx.fillStyle = idx === 0 ? '#34d399' : '#10b981';
          ctx.beginPath();
          ctx.roundRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4, 5);
          ctx.fill();
        });
      }

      function queueDir(nx, ny) {
        const last = queue.length > 0 ? queue[queue.length - 1] : dir;
        if (last.x + nx === 0 && last.y + ny === 0) return;
        if (last.x === nx && last.y === ny) return;
        if (queue.length < 2) queue.push({ x: nx, y: ny });
      }

      function togglePause() {
        if (state === 'PLAYING') {
          state = 'PAUSED';
          clearInterval(timer);
          pauseBtn.textContent = 'Resume';
          overlayTitle.textContent = 'Paused';
          overlayDesc.textContent = 'Press Resume or P to continue.';
          startBtn.textContent = 'Resume';
          overlay.classList.remove('hidden');
        } else if (state === 'PAUSED') {
          state = 'PLAYING';
          pauseBtn.textContent = 'Pause';
          overlay.classList.add('hidden');
          timer = setInterval(tick, speedMs);
        }
      }

      window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') queueDir(0, -1);
        else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') queueDir(0, 1);
        else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') queueDir(-1, 0);
        else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') queueDir(1, 0);
        else if (e.key === 'p' || e.key === 'P') togglePause();
      });

      let tx = 0, ty = 0;
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches[0]) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }
      }, { passive: true });
      canvas.addEventListener('touchend', (e) => {
        if (!e.changedTouches[0]) return;
        const dx = e.changedTouches[0].clientX - tx;
        const dy = e.changedTouches[0].clientY - ty;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 1 : -1, 0);
        else queueDir(0, dy > 0 ? 1 : -1);
      });

      startBtn.addEventListener('click', () => {
        if (state === 'PAUSED') togglePause();
        else startGame();
      });
      pauseBtn.addEventListener('click', togglePause);

      draw();
    })();
  </script>
</body>
</html>
