<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Pairs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #231915;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #1a120f;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      flex-wrap: wrap;
      gap: 12px;
    }
    .hud-group { display: flex; align-items: center; gap: 16px; }
    .hud-label { color: #a8998c; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 5px; }
    .hud-val { font-weight: 700; color: #f8f5f0; }
    .seg { display: flex; gap: 6px; }
    button {
      background: #332520;
      color: #f3ece4;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.active { background: #e11d48; border-color: #e11d48; color: #ffffff; }
    .board-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      min-height: 0;
    }
    .grid {
      display: grid;
      gap: 10px;
      width: 100%;
      max-width: 560px;
      max-height: 100%;
    }
    .card {
      aspect-ratio: 3 / 3.4;
      perspective: 700px;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .face-back {
      background: #f5f0e8;
      border: 2px solid #d6ccbe;
      background-image: radial-gradient(#c5b9a7 1px, transparent 1px);
      background-size: 10px 10px;
    }
    .face-front {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      transform: rotateY(180deg);
      color: #1e3a8a;
    }
    .card.matched .face-front {
      background: #ecfdf5;
      border-color: #10b981;
      color: #047857;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(26, 18, 15, 0.86);
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: #2a1f1a;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 26px;
      text-align: center;
      max-width: 340px;
      width: 100%;
    }
    .modal h2 { font-size: 24px; margin-bottom: 8px; }
    .modal p { font-size: 14px; color: #d6ccc2; margin-bottom: 18px; }
    .btn-primary {
      background: #e11d48;
      color: #ffffff;
      border: none;
      padding: 10px 22px;
      font-size: 14px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-group">
      <div><span class="hud-label">Moves</span><span class="hud-val" id="movesEl">0</span></div>
      <div><span class="hud-label">Time</span><span class="hud-val" id="timeEl">0s</span></div>
      <div><span class="hud-label">Pairs</span><span class="hud-val" id="pairsEl">0 / 8</span></div>
    </div>
    <div class="hud-group">
      <div class="seg" id="sizeSeg">
        <button type="button" data-cols="4" data-rows="3">4×3</button>
        <button type="button" data-cols="4" data-rows="4" class="active">4×4</button>
        <button type="button" data-cols="6" data-rows="4">6×4</button>
      </div>
      <button type="button" id="resetBtn">Restart</button>
    </div>
  </div>

  <div class="board-wrap">
    <div class="grid" id="gridEl"></div>
    <div class="overlay hidden" id="winOverlay">
      <div class="modal">
        <h2>Board Cleared</h2>
        <p id="winSummary">Completed in 0 moves.</p>
        <button class="btn-primary" id="againBtn" type="button">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const ICONS = [
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 19 2 19 12 2"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="12" y1="4" x2="12" y2="20"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.41L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.41L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><line x1="12" y1="22" x2="12" y2="8"/><path d="M5 12H2a10 10 0 0 0 20 0h-3"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>',
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>'
      ];

      const gridEl = document.getElementById('gridEl');
      const movesEl = document.getElementById('movesEl');
      const timeEl = document.getElementById('timeEl');
      const pairsEl = document.getElementById('pairsEl');
      const winOverlay = document.getElementById('winOverlay');
      const winSummary = document.getElementById('winSummary');
      const resetBtn = document.getElementById('resetBtn');
      const againBtn = document.getElementById('againBtn');

      let cols = 4, rows = 4;
      let first = null, second = null, lock = false;
      let moves = 0, matched = 0, totalPairs = 8;
      let seconds = 0, timer = null;

      function startBoard() {
        clearInterval(timer);
        timer = null;
        seconds = 0;
        moves = 0;
        matched = 0;
        first = null;
        second = null;
        lock = false;
        totalPairs = (cols * rows) / 2;

        movesEl.textContent = '0';
        timeEl.textContent = '0s';
        pairsEl.textContent = '0 / ' + totalPairs;
        winOverlay.classList.add('hidden');

        gridEl.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
        gridEl.style.maxWidth = cols === 6 ? '640px' : '440px';
        gridEl.innerHTML = '';

        const deck = [];
        for (let i = 0; i < totalPairs; i++) {
          deck.push(i, i);
        }
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
        }

        deck.forEach((symId) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'card';
          btn.dataset.sym = String(symId);
          btn.innerHTML = '<div class="card-inner"><div class="face face-back"></div><div class="face face-front">' + ICONS[symId] + '</div></div>';
          btn.addEventListener('click', () => onFlip(btn));
          gridEl.appendChild(btn);
        });
      }

      function onFlip(card) {
        if (lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
        if (!timer) {
          timer = setInterval(() => {
            seconds++;
            timeEl.textContent = seconds + 's';
          }, 1000);
        }

        card.classList.add('flipped');
        if (!first) {
          first = card;
          return;
        }
        second = card;
        moves++;
        movesEl.textContent = String(moves);

        if (first.dataset.sym === second.dataset.sym) {
          first.classList.add('matched');
          second.classList.add('matched');
          matched++;
          pairsEl.textContent = matched + ' / ' + totalPairs;
          first = null;
          second = null;
          if (matched === totalPairs) {
            clearInterval(timer);
            winSummary.textContent = 'Cleared in ' + moves + ' moves and ' + seconds + ' seconds.';
            setTimeout(() => winOverlay.classList.remove('hidden'), 260);
          }
        } else {
          lock = true;
          setTimeout(() => {
            first.classList.remove('flipped');
            second.classList.remove('flipped');
            first = null;
            second = null;
            lock = false;
          }, 620);
        }
      }

      document.querySelectorAll('#sizeSeg button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#sizeSeg button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          cols = Number(btn.dataset.cols);
          rows = Number(btn.dataset.rows);
          startBoard();
        });
      });

      resetBtn.addEventListener('click', startBoard);
      againBtn.addEventListener('click', startBoard);
      startBoard();
    })();
  </script>
</body>
</html>
