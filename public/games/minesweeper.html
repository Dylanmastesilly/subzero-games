<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minesweeper Grid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #1e242b;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: #151a20;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      flex-wrap: wrap;
      gap: 10px;
    }
    .hud-group { display: flex; align-items: center; gap: 14px; }
    .hud-label { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 5px; }
    .hud-val { font-weight: 700; }
    button {
      background: #2c3540;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.active { background: #e11d48; border-color: #e11d48; color: #ffffff; }
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      gap: 12px;
      overflow: auto;
    }
    .banner {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      min-height: 20px;
    }
    .banner.win { color: #34d399; }
    .banner.lose { color: #fb7185; }
    .board {
      display: grid;
      gap: 3px;
      background: #151a20;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .cell {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      border: none;
      background: #3b4654;
      color: #f8fafc;
      font-size: 14px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .cell:hover:not(.revealed) { background: #4a5768; }
    .cell.revealed { background: #d6cebe; color: #1e293b; cursor: default; }
    .cell.flagged { background: #475569; color: #fb7185; }
    .cell.mine { background: #e11d48; color: #ffffff; }
    .n1 { color: #1d4ed8; }
    .n2 { color: #15803d; }
    .n3 { color: #b91c1c; }
    .n4 { color: #6d28d9; }
    .n5 { color: #9a3412; }
    .n6 { color: #0e7490; }
    .n7 { color: #111827; }
    .n8 { color: #475569; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-group">
      <div><span class="hud-label">Mines</span><span class="hud-val" id="minesEl">10</span></div>
      <div><span class="hud-label">Time</span><span class="hud-val" id="timeEl">0s</span></div>
    </div>
    <div class="hud-group">
      <button type="button" id="flagModeBtn">Flag Mode: Off</button>
      <div class="hud-group" id="diffGroup" style="gap:6px;">
        <button type="button" data-diff="easy" class="active">9×9</button>
        <button type="button" data-diff="med">12×12</button>
        <button type="button" data-diff="hard">16×12</button>
      </div>
      <button type="button" id="resetBtn">New Board</button>
    </div>
  </div>

  <div class="stage">
    <div class="banner" id="bannerEl">Left click to reveal · Right click to place a flag</div>
    <div class="board" id="boardEl"></div>
  </div>

  <script>
    (function () {
      const PRESETS = {
        easy: { cols: 9, rows: 9, mines: 10 },
        med: { cols: 12, rows: 12, mines: 22 },
        hard: { cols: 16, rows: 12, mines: 35 }
      };

      const boardEl = document.getElementById('boardEl');
      const minesEl = document.getElementById('minesEl');
      const timeEl = document.getElementById('timeEl');
      const bannerEl = document.getElementById('bannerEl');
      const flagModeBtn = document.getElementById('flagModeBtn');
      const resetBtn = document.getElementById('resetBtn');

      let cfg = PRESETS.easy;
      let grid = [];
      let firstClick = true;
      let gameOver = false;
      let flagMode = false;
      let flagsUsed = 0;
      let revealedCount = 0;
      let seconds = 0;
      let timer = null;

      function init() {
        clearInterval(timer);
        timer = null;
        seconds = 0;
        firstClick = true;
        gameOver = false;
        flagsUsed = 0;
        revealedCount = 0;
        timeEl.textContent = '0s';
        minesEl.textContent = String(cfg.mines);
        bannerEl.className = 'banner';
        bannerEl.textContent = 'Left click to reveal · Right click to place a flag';

        boardEl.style.gridTemplateColumns = 'repeat(' + cfg.cols + ', 32px)';
        boardEl.innerHTML = '';
        grid = [];

        for (let r = 0; r < cfg.rows; r++) {
          const row = [];
          for (let c = 0; c < cfg.cols; c++) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cell';
            btn.addEventListener('click', () => handleLeft(r, c));
            btn.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              toggleFlag(r, c);
            });
            boardEl.appendChild(btn);
            row.push({ mine: false, revealed: false, flagged: false, count: 0, el: btn });
          }
          grid.push(row);
        }
      }

      function neighbors(r, c) {
        const res = [];
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < cfg.rows && nc >= 0 && nc < cfg.cols) res.push([nr, nc]);
          }
        }
        return res;
      }

      function placeMines(safeR, safeC) {
        let placed = 0;
        while (placed < cfg.mines) {
          const r = Math.floor(Math.random() * cfg.rows);
          const c = Math.floor(Math.random() * cfg.cols);
          if (grid[r][c].mine) continue;
          if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
          grid[r][c].mine = true;
          placed++;
        }
        for (let r = 0; r < cfg.rows; r++) {
          for (let c = 0; c < cfg.cols; c++) {
            if (grid[r][c].mine) continue;
            grid[r][c].count = neighbors(r, c).filter(([nr, nc]) => grid[nr][nc].mine).length;
          }
        }
      }

      function toggleFlag(r, c) {
        if (gameOver) return;
        const cell = grid[r][c];
        if (cell.revealed) return;
        cell.flagged = !cell.flagged;
        flagsUsed += cell.flagged ? 1 : -1;
        cell.el.classList.toggle('flagged', cell.flagged);
        cell.el.textContent = cell.flagged ? '⚑' : '';
        minesEl.textContent = String(cfg.mines - flagsUsed);
      }

      function revealCell(r, c) {
        const cell = grid[r][c];
        if (cell.revealed || cell.flagged) return;
        cell.revealed = true;
        cell.el.classList.add('revealed');

        if (cell.mine) {
          cell.el.classList.add('mine');
          cell.el.textContent = '✸';
          loseGame();
          return;
        }

        revealedCount++;
        if (cell.count > 0) {
          cell.el.textContent = String(cell.count);
          cell.el.classList.add('n' + cell.count);
        } else {
          for (const [nr, nc] of neighbors(r, c)) {
            if (!grid[nr][nc].revealed) revealCell(nr, nc);
          }
        }

        if (revealedCount === cfg.rows * cfg.cols - cfg.mines) {
          winGame();
        }
      }

      function handleLeft(r, c) {
        if (gameOver) return;
        if (flagMode) {
          toggleFlag(r, c);
          return;
        }
        const cell = grid[r][c];
        if (firstClick) {
          firstClick = false;
          placeMines(r, c);
          timer = setInterval(() => { seconds++; timeEl.textContent = seconds + 's'; }, 1000);
        }
        if (cell.revealed && cell.count > 0) {
          const adj = neighbors(r, c);
          const adjFlags = adj.filter(([nr, nc]) => grid[nr][nc].flagged).length;
          if (adjFlags === cell.count) {
            adj.forEach(([nr, nc]) => {
              if (!grid[nr][nc].revealed && !grid[nr][nc].flagged) revealCell(nr, nc);
            });
          }
          return;
        }
        revealCell(r, c);
      }

      function loseGame() {
        gameOver = true;
        clearInterval(timer);
        bannerEl.className = 'banner lose';
        bannerEl.textContent = 'Mine triggered! Click New Board to try again.';
        for (let r = 0; r < cfg.rows; r++) {
          for (let c = 0; c < cfg.cols; c++) {
            if (grid[r][c].mine && !grid[r][c].revealed) {
              grid[r][c].el.classList.add('revealed', 'mine');
              grid[r][c].el.textContent = '✸';
            }
          }
        }
      }

      function winGame() {
        gameOver = true;
        clearInterval(timer);
        bannerEl.className = 'banner win';
        bannerEl.textContent = 'Board cleared in ' + seconds + ' seconds!';
      }

      flagModeBtn.addEventListener('click', () => {
        flagMode = !flagMode;
        flagModeBtn.textContent = flagMode ? 'Flag Mode: On' : 'Flag Mode: Off';
        flagModeBtn.classList.toggle('active', flagMode);
      });

      document.querySelectorAll('#diffGroup button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#diffGroup button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          cfg = PRESETS[btn.dataset.diff];
          init();
        });
      });

      resetBtn.addEventListener('click', init);
      init();
    })();
  </script>
</body>
</html>
