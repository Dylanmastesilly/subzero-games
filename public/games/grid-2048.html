<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid 2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #f5f2eb;
      color: #1f2421;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .wrap {
      width: 100%;
      max-width: 440px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .title { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; color: #1f2421; }
    .scores { display: flex; gap: 8px; }
    .score-box {
      background: #e6dfd3;
      border-radius: 8px;
      padding: 6px 12px;
      text-align: center;
      min-width: 72px;
    }
    .score-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #645c50; letter-spacing: 0.06em; }
    .score-val { font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums; color: #1f2421; }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13px;
      color: #5c5449;
    }
    .actions { display: flex; gap: 8px; }
    button {
      background: #1f2421;
      color: #ffffff;
      border: none;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #363e3a; }
    button.secondary {
      background: #e6dfd3;
      color: #1f2421;
    }
    button.secondary:hover { background: #d8cfc0; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .board {
      position: relative;
      background: #cfc6b8;
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      aspect-ratio: 1 / 1;
      touch-action: none;
    }
    .cell {
      background: #e6dfd3;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      transition: transform 90ms ease;
    }
    .cell.pop { transform: scale(1.06); }
    .v-0 { background: #dfd7c8; color: transparent; }
    .v-2 { background: #f8f5ef; color: #1f2421; }
    .v-4 { background: #efe6d5; color: #1f2421; }
    .v-8 { background: #ea9a66; color: #ffffff; }
    .v-16 { background: #e27848; color: #ffffff; }
    .v-32 { background: #d95638; color: #ffffff; }
    .v-64 { background: #c93b2b; color: #ffffff; }
    .v-128 { background: #e8b84b; color: #ffffff; font-size: 24px; }
    .v-256 { background: #e2ab32; color: #ffffff; font-size: 24px; }
    .v-512 { background: #d99b1e; color: #ffffff; font-size: 24px; }
    .v-1024 { background: #2c6e49; color: #ffffff; font-size: 20px; }
    .v-2048 { background: #1d4ed8; color: #ffffff; font-size: 20px; }
    .overlay {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: rgba(245, 242, 235, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 26px; font-weight: 800; }
    .overlay p { font-size: 14px; color: #5c5449; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">2048</div>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-val" id="scoreEl">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Best</div>
          <div class="score-val" id="bestEl">0</div>
        </div>
      </div>
    </div>

    <div class="controls">
      <span>Join numbers to reach 2048</span>
      <div class="actions">
        <button class="secondary" id="undoBtn" type="button" disabled>Undo</button>
        <button id="newBtn" type="button">New Game</button>
      </div>
    </div>

    <div class="board" id="boardEl">
      <div class="overlay hidden" id="overlayEl">
        <h2 id="overlayTitle">Game Over</h2>
        <p id="overlayDesc">No valid moves remaining.</p>
        <div class="actions">
          <button class="secondary hidden" id="keepBtn" type="button">Keep Playing</button>
          <button id="retryBtn" type="button">Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const boardEl = document.getElementById('boardEl');
      const scoreEl = document.getElementById('scoreEl');
      const bestEl = document.getElementById('bestEl');
      const undoBtn = document.getElementById('undoBtn');
      const newBtn = document.getElementById('newBtn');
      const overlayEl = document.getElementById('overlayEl');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayDesc = document.getElementById('overlayDesc');
      const keepBtn = document.getElementById('keepBtn');
      const retryBtn = document.getElementById('retryBtn');

      const BEST_KEY = 'recess_grid_2048_best';
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      let grid = [];
      let score = 0;
      let prevState = null;
      let wonOnce = false;
      let cells = [];

      for (let i = 0; i < 16; i++) {
        const div = document.createElement('div');
        div.className = 'cell v-0';
        boardEl.insertBefore(div, overlayEl);
        cells.push(div);
      }

      function cloneGrid(g) { return g.map(row => row.slice()); }

      function addRandomTile() {
        const empty = [];
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            if (grid[r][c] === 0) empty.push([r, c]);
          }
        }
        if (empty.length === 0) return;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
      }

      function render() {
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            const val = grid[r][c];
            const el = cells[r * 4 + c];
            el.textContent = val === 0 ? '' : String(val);
            el.className = 'cell v-' + (val <= 2048 ? val : 2048);
          }
        }
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem(BEST_KEY, String(best));
        }
        bestEl.textContent = best;
        undoBtn.disabled = !prevState;
      }

      function startNew() {
        grid = Array.from({ length: 4 }, () => [0, 0, 0, 0]);
        score = 0;
        prevState = null;
        wonOnce = false;
        overlayEl.classList.add('hidden');
        keepBtn.classList.add('hidden');
        addRandomTile();
        addRandomTile();
        render();
      }

      function slideLine(line) {
        const filtered = line.filter(v => v !== 0);
        const result = [];
        let gained = 0;
        for (let i = 0; i < filtered.length; i++) {
          if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
            const merged = filtered[i] * 2;
            result.push(merged);
            gained += merged;
            i++;
          } else {
            result.push(filtered[i]);
          }
        }
        while (result.length < 4) result.push(0);
        return { result, gained };
      }

      function canMove() {
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            if (grid[r][c] === 0) return true;
            if (r < 3 && grid[r][c] === grid[r + 1][c]) return true;
            if (c < 3 && grid[r][c] === grid[r][c + 1]) return true;
          }
        }
        return false;
      }

      function move(dir) {
        if (!overlayEl.classList.contains('hidden')) return;
        const snapshot = { grid: cloneGrid(grid), score };
        let moved = false;
        let gainedTotal = 0;

        if (dir === 'left' || dir === 'right') {
          for (let r = 0; r < 4; r++) {
            const orig = grid[r].slice();
            const line = dir === 'right' ? orig.slice().reverse() : orig.slice();
            const { result, gained } = slideLine(line);
            const finalLine = dir === 'right' ? result.reverse() : result;
            if (finalLine.some((v, idx) => v !== orig[idx])) moved = true;
            grid[r] = finalLine;
            gainedTotal += gained;
          }
        } else {
          for (let c = 0; c < 4; c++) {
            const orig = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
            const line = dir === 'down' ? orig.slice().reverse() : orig.slice();
            const { result, gained } = slideLine(line);
            const finalLine = dir === 'down' ? result.reverse() : result;
            for (let r = 0; r < 4; r++) {
              if (grid[r][c] !== finalLine[r]) moved = true;
              grid[r][c] = finalLine[r];
            }
            gainedTotal += gained;
          }
        }

        if (!moved) return;
        prevState = snapshot;
        score += gainedTotal;
        addRandomTile();
        render();

        if (!wonOnce && grid.some(row => row.includes(2048))) {
          wonOnce = true;
          overlayTitle.textContent = '2048 Reached!';
          overlayDesc.textContent = 'You formed the 2048 tile. Keep pushing your score or start fresh.';
          keepBtn.classList.remove('hidden');
          overlayEl.classList.remove('hidden');
          return;
        }

        if (!canMove()) {
          overlayTitle.textContent = 'Game Over';
          overlayDesc.textContent = 'Final Score: ' + score;
          keepBtn.classList.add('hidden');
          overlayEl.classList.remove('hidden');
        }
      }

      undoBtn.addEventListener('click', () => {
        if (!prevState) return;
        grid = prevState.grid;
        score = prevState.score;
        prevState = null;
        overlayEl.classList.add('hidden');
        render();
      });

      newBtn.addEventListener('click', startNew);
      retryBtn.addEventListener('click', startNew);
      keepBtn.addEventListener('click', () => overlayEl.classList.add('hidden'));

      window.addEventListener('keydown', (e) => {
        const map = {
          ArrowLeft: 'left', a: 'left', A: 'left',
          ArrowRight: 'right', d: 'right', D: 'right',
          ArrowUp: 'up', w: 'up', W: 'up',
          ArrowDown: 'down', s: 'down', S: 'down'
        };
        if (map[e.key]) {
          e.preventDefault();
          move(map[e.key]);
        }
      });

      let startX = 0, startY = 0;
      boardEl.addEventListener('touchstart', (e) => {
        if (!e.touches[0]) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });
      boardEl.addEventListener('touchend', (e) => {
        if (!e.changedTouches[0]) return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
        else move(dy > 0 ? 'down' : 'up');
      });

      startNew();
    })();
  </script>
</body>
</html>
